<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Simulator - Сервисное меню</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .service-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #2c2e33;
            border: 2px solid #343a40;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            text-align: center;
        }
        .service-input:focus {
            outline: none;
            border-color: #339af0;
        }
        .service-btn {
            background-color: #343a40;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .service-btn:hover {
            background-color: #3b3d42;
        }
        .service-btn.danger {
            background-color: #ff6b6b;
            color: white;
        }
        .service-btn.danger:hover {
            background-color: #fa5252;
        }
        
        .pos-container.scrollable {
            overflow-y: auto;
            justify-content: flex-start;
            padding: 20px;
        }
        
        .pos-container.scrollable::-webkit-scrollbar {
            width: 5px;
        }
        .pos-container.scrollable::-webkit-scrollbar-thumb {
            background-color: #343a40;
            border-radius: 5px;
        }

        .section-title {
            font-size: 16px;
            color: #868e96;
            margin-bottom: 15px;
            border-bottom: 1px solid #343a40;
            padding-bottom: 5px;
            text-align: left;
            width: 100%;
            margin-top: 20px;
        }

        .setting-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .setting-group label {
            font-size: 14px;
            color: #f8f9fa;
        }
        .setting-group input {
            width: 80px;
            padding: 8px;
            background: #2c2e33;
            border: 1px solid #343a40;
            border-radius: 5px;
            color: white;
            text-align: center;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .history-item {
            background: #2c2e33;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 12px;
        }
        .history-item .row {
            display: flex;
            justify-content: space-between;
        }
        .history-item .sum {
            font-size: 16px;
            font-weight: bold;
            color: #f8f9fa;
        }
        .history-item .net {
            color: #51cf66;
            font-weight: bold;
        }
        .refund-btn {
            background-color: #343a40;
            color: #ff6b6b;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 5px;
            align-self: flex-start;
        }
        .refund-btn:disabled {
            color: #868e96;
            cursor: not-allowed;
            text-decoration: line-through;
        }
    </style>
</head>
<body>
    <div class="pos-container scrollable">
        
        <!-- Login Screen -->
        <div id="screen-login" class="screen active" style="padding: 30px 20px;">
            <div class="header">
                <h1>Сервисный вход</h1>
            </div>
            <div class="processing-content" style="justify-content: flex-start; padding-top: 50px;">
                <p style="margin-bottom: 15px; color: #868e96; text-align: center;">Введите пароль для доступа</p>
                <input type="password" id="admin-password" class="service-input" placeholder="Пароль">
                <button class="pay-btn" style="width: 100%; margin-top: 20px;" onclick="checkPassword()">Войти</button>
            </div>
            <div id="login-error" style="color: #ff6b6b; text-align: center; margin-top: 20px; display: none;">Неверный пароль</div>
        </div>

        <!-- Service Menu Screen -->
        <div id="screen-menu" style="display: none; width: 100%;">
            <div class="header" style="position: relative; margin-bottom: 20px;">
                <button class="back-btn" onclick="logout()" style="top: -10px;"><i class="fas fa-sign-out-alt"></i></button>
                <h1 style="font-size: 20px; font-weight: 600; text-align: center; color: #868e96;">Сервисное меню</h1>
            </div>
            
            <h2 style="font-size: 16px; text-align: center;">Текущий баланс: <br><span id="current-balance" style="color: #51cf66; font-size: 38px; display: inline-block; margin-top: 10px;">0.00</span> ₽</h2>
            
            <button class="service-btn danger" style="margin-top: 20px;" onclick="resetBalance()">
                <i class="fas fa-trash-alt"></i> Обнулить баланс
            </button>
            <button class="service-btn" onclick="setCustomBalance()">
                <i class="fas fa-edit"></i> Задать баланс вручную
            </button>

            <div class="section-title">Кастомизация</div>
            <div class="setting-group">
                <label>Название терминала</label>
                <input type="text" id="setting-name" value="Qiwi.tech" style="width: 150px; text-align: right;" onchange="saveSettings()">
            </div>
            <div class="setting-group">
                <label>URL Логотипа</label>
                <input type="text" id="setting-logo" placeholder="https://..." style="width: 150px; text-align: right;" onchange="saveSettings()">
            </div>
            <div class="setting-group">
                <label>Основной цвет</label>
                <input type="color" id="setting-color" value="#ff8c00" style="padding: 0; width: 40px; height: 30px;" onchange="saveSettings()">
            </div>
            <div class="setting-group">
                <label>Светлая тема</label>
                <input type="checkbox" id="setting-light" onchange="saveSettings()">
            </div>

            <div class="section-title">Симуляция сети и отказов</div>
            <div class="setting-group">
                <label>Шанс отказа (%)</label>
                <input type="number" id="setting-decline" value="0" min="0" max="100" onchange="saveSettings()">
            </div>
            <div class="setting-group">
                <label>Задержка связи (имитация лагов)</label>
                <input type="checkbox" id="setting-delay" onchange="saveSettings()">
            </div>

            <div class="section-title">Безопасность и касса</div>
            <div class="setting-group">
                <label>Комиссия (%)</label>
                <input type="number" id="setting-commission" value="9" min="0" max="100" onchange="saveSettings()">
            </div>
            <div class="setting-group">
                <label>Требовать ПИН-код (кассир)</label>
                <input type="checkbox" id="setting-pin-enabled" onchange="saveSettings()">
            </div>
            <div class="setting-group">
                <label>ПИН-код</label>
                <input type="password" id="setting-pin" value="0000" maxlength="4" style="width: 60px;" onchange="saveSettings()">
            </div>

            <div class="section-title">Бета-функции (Тестирование)</div>
            <div class="setting-group" style="flex-direction: column; align-items: flex-start; gap: 10px;">
                <label>
                    <input type="checkbox" id="setting-printer" onchange="saveSettings()">
                    Чековый принтер (реальная печать)
                </label>
                <label>
                    <input type="checkbox" id="setting-nfc" onchange="saveSettings()">
                    Физическая NFC-карта (Web NFC)
                </label>
                <label>
                    <input type="checkbox" id="setting-ext-nfc" onchange="saveSettings()">
                    Внешний USB NFC-считыватель (pre-alpha)
                </label>
                <label>
                    <input type="checkbox" id="setting-voice" onchange="saveSettings()">
                    Голосовое сопровождение
                </label>
                <label>
                    <input type="checkbox" id="setting-barcode" onchange="saveSettings()">
                    Аппаратный сканер штрих-кодов
                </label>
            </div>

            <div class="section-title">Сертификат безопасности (qiwi.cert)</div>
            <div style="background: #2c2e33; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
                <div class="setting-group">
                    <label>Terminal ID</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="cert-tid" readonly style="width: 100px;">
                        <button class="service-btn" style="margin: 0; padding: 8px; width: auto;" onclick="generateTID()"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Merchant ID</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="cert-mid" value="0000000000" maxlength="10" style="width: 100px;" oninput="updateMIDStatus()">
                        <span id="mid-status" style="font-size: 12px; color: #868e96;">(Не на учете)</span>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Срок действия</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="cert-date" readonly style="width: 100px;">
                        <button class="service-btn" style="margin: 0; padding: 8px; width: auto;" onclick="generateDate()"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Организация</label>
                    <input type="text" id="cert-org" value="KeyMS лицензия от Qiwi.tech" readonly style="width: 220px; font-size: 11px;">
                </div>
                <div class="setting-group">
                    <label>Криптоключ</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="text" id="cert-key" readonly style="width: 130px; font-size: 12px;">
                        <button class="service-btn" style="margin: 0; padding: 8px; width: auto;" onclick="generateKey()"><i class="fas fa-sync-alt"></i></button>
                    </div>
                </div>
                
                <button class="service-btn" onclick="downloadCert()" style="background-color: #51cf66; margin-top: 15px;">
                    <i class="fas fa-download"></i> Скачать qiwi.cert
                </button>
            </div>

            <div class="section-title">История транзакций</div>
            <button class="service-btn" onclick="downloadZReport()" style="background-color: #339af0; margin-bottom: 15px;">
                <i class="fas fa-file-csv"></i> Снять Z-Отчет (CSV)
            </button>
            <div class="history-list" id="history-list">
                <!-- Transactions will be populated here -->
                <div style="text-align: center; color: #868e96; font-size: 14px;">Нет данных</div>
            </div>
            <button class="service-btn" onclick="clearHistory()" style="background-color: #2c2e33;">
                <i class="fas fa-eraser"></i> Очистить историю
            </button>
        </div>

    </div>

    <script type="module" src="services.js"></script>
</body>
</html>
