<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 3.6 Code</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Chats & Auth -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="glow-btn" style="width: 100%; border-radius: 8px;">
                    <i data-lucide="plus"></i> Новый чат
                </button>
                <div style="margin-top: 10px; position: relative;">
                    <i data-lucide="search" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-secondary);"></i>
                    <input type="text" id="search-chat-input" placeholder="Поиск чатов..." style="width: 100%; padding: 8px 10px 8px 34px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; font-size: 0.9rem; font-family: inherit;">
                </div>
            </div>
            <div class="chat-list" id="chat-list">
                <div style="padding: 20px; text-align: center; color: var(--text-secondary); font-size: 0.9rem;">
                    Войдите, чтобы сохранять историю
                </div>
            </div>
            <div class="sidebar-footer">
                <button id="google-login-btn" class="glow-btn outline" style="width: 100%; border-radius: 8px; background: rgba(255,255,255,0.1); box-shadow: none;">
                    <i data-lucide="log-in"></i> Войти
                </button>
                <div id="user-info" class="user-info" style="display: none;">
                    <img id="user-avatar" src="" alt="A" style="width: 32px; height: 32px; border-radius: 50%;">
                    <span id="user-name" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem;"></span>
                    <i data-lucide="log-out" id="logout-btn" style="cursor: pointer; width: 18px; height: 18px;"></i>
                </div>
            </div>
        </aside>

        <!-- Center Panel: AI Chat -->
        <section class="chat-panel glass-panel">
            <header class="panel-header" style="justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i data-lucide="cpu" style="color: var(--accent-color); width: 32px; height: 32px;"></i>
                    <h1>Gemini 3.6 Code</h1>
                </div>
                <button id="save-chat-btn" class="glow-btn" style="width: auto; padding: 0 12px; height: 36px;" title="Скачать диалог">
                    <i data-lucide="download" style="width: 18px; height: 18px;"></i>
                </button>
            </header>
            
            <div class="chat-history" id="chat-history">
                <div class="chat-message ai-message">
                    <div class="message-content">Привет! Я твой ИИ-помощник для Arduino. Напиши, что ты хочешь создать, и я сгенерирую код!</div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <textarea id="prompt-input" placeholder="Напиши запрос (например, 'мигать светодиодом')..."></textarea>
                <button id="send-btn" class="glow-btn"><i data-lucide="send"></i></button>
            </div>
        </section>

        <!-- Right Panel: Code Output -->
        <section class="code-panel glass-panel">
            <header class="panel-header">
                <i data-lucide="code"></i>
                <h2>Поле вывода кода</h2>
            </header>
            <div class="editor-container" id="editor-container">
                <!-- Monaco Editor will be mounted here -->
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <!-- Firebase SDK (v9 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Icons & Editor -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.46.0/min/vs/loader.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
